name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # run manually for testing

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MICRONAUT_DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
      MICRONAUT_DATASOURCES_DEFAULT_USERNAME: root
      MICRONAUT_DATASOURCES_DEFAULT_PASSWORD: password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost -uroot -ppassword" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and test
        run: ./gradlew build --no-daemon
      
      - name: API test (curl)
        run: |
          java -jar build/libs/*-all.jar &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/v1/book/all >/dev/null && break; sleep 2; done
          curl -sf -X POST http://localhost:8080/api/v1/book/save -H "Content-Type: application/json" -d '{"name":"CI Book","author":"Test","price":9.99,"totalPage":100}'
          curl -sf http://localhost:8080/api/v1/book/all | grep -q "CI Book" || (echo "Book not found in list"; exit 1)
          curl -sf http://localhost:8080/api/v1/book/1 | grep -q "CI Book" || (echo "Book not found by id"; exit 1)
          echo "API test passed"

      # JAR is created in build/libs
      # Upload step saves it as a workflow artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/*-all.jar


