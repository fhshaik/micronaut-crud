name: CI - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # run manually for testing

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: "1.44"  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and test
        run: ./gradlew build --no-daemon
      
      - name: Run API test script
        run: bash scripts/test-api.sh

      # JAR is created in build/libs
      # Upload step saves it as a workflow artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/*-all.jar


